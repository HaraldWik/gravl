name: macOS Build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        working-directory: game
        run: zig build -Dtarget=aarch64-macos